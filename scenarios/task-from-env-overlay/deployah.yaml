# $schema: ../../internal/spec/schema/v1-alpha.5/manifest.json
apiVersion: v1-alpha.5
project: task-from-env-overlay
components:
  api:
    image: nginx:latest
    port: 8080
    environments: [dev]
    resourcePreset: small
    env:
      DATABASE_URL: postgres://db
      LOG: info
tasks:
  migrate:
    from: api
    "on": preDeploy
    command: ["migrate", "up"]
    env:
      LOG: debug
      EXTRA: "1"
environments:
  dev: {}
