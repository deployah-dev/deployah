apiVersion: apps/v1
kind: Deployment
metadata:
    annotations:
        deployah.dev/project: worker-exec-health
        deployah.dev/source: spec
    labels:
        app.kubernetes.io/instance: worker-exec-health-dev
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: worker
        deployah.dev/component: worker
        deployah.dev/environment: dev
        deployah.dev/project: worker-exec-health
        helm.sh/chart: worker-0.1.0
    name: worker-exec-health-dev
    namespace: default
spec:
    replicas: 1
    revisionHistoryLimit: 10
    selector:
        matchLabels:
            app.kubernetes.io/instance: worker-exec-health-dev
            app.kubernetes.io/name: worker
    strategy:
        type: RollingUpdate
    template:
        metadata:
            annotations: null
            labels:
                app.kubernetes.io/instance: worker-exec-health-dev
                app.kubernetes.io/managed-by: Helm
                app.kubernetes.io/name: worker
                deployah.dev/component: worker
                deployah.dev/environment: dev
                deployah.dev/project: worker-exec-health
                helm.sh/chart: worker-0.1.0
        spec:
            affinity:
                podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        - podAffinityTerm:
                            labelSelector:
                                matchLabels:
                                    app.kubernetes.io/instance: worker-exec-health-dev
                                    app.kubernetes.io/name: worker
                            topologyKey: kubernetes.io/hostname
                          weight: 1
            containers:
                - image: ghcr.io/acme/worker:1.0.0
                  imagePullPolicy: IfNotPresent
                  livenessProbe:
                    exec:
                        command:
                            - /bin/grpc_health_probe
                            - -addr=:50051
                    failureThreshold: 6
                    periodSeconds: 10
                    timeoutSeconds: 3
                  name: worker
                  resources:
                    limits: {}
                    requests:
                        cpu: 500m
                        ephemeral-storage: 50Mi
                        memory: 512Mi
            restartPolicy: Always
            serviceAccountName: default
            terminationGracePeriodSeconds: 60
