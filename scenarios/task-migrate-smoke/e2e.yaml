# $schema: ../../internal/testing/e2e.schema.json
env: dev
steps:
  - deploy: {}
    stopOnFailure: true
  - assert:
      - select:
          apiVersion: apps/v1
          kind: Deployment
          name: taskdemo-dev-api
          labels:
            deployah.dev/project: taskdemo
            deployah.dev/environment: dev
            deployah.dev/component: api
        expect:
          spec:
            replicas: 1
            template:
              spec:
                containers:
                  - name: api
                    image: docker.io/library/nginx:latest
          status:
            readyReplicas: 1
      - select:
          apiVersion: v1
          kind: Service
          name: taskdemo-dev-api
        expect:
          spec:
            ports:
              - name: http
                port: 80
                targetPort: http
  - run:
      task: backfill
  - run:
      task: backfill
    stopOnFailure: true
  - assert:
      - select:
          apiVersion: batch/v1
          kind: Job
          labels:
            deployah.dev/project: taskdemo
            deployah.dev/component: backfill
        expect:
          status:
            succeeded: 1
        expr:
          - 'objects.size() >= 2'
  - logs:
      component: backfill
      contains:
        - backfill-ok
  - delete: {}
    stopOnFailure: true
  - assert:
      - select:
          apiVersion: batch/v1
          kind: Job
          labels:
            deployah.dev/project: taskdemo
            deployah.dev/environment: dev
        expr:
          - 'objects.size() == 0'
