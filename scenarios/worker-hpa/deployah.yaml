# $schema: ../../internal/spec/schema/v1-alpha.5/manifest.json
apiVersion: v1-alpha.5
project: worker-hpa
components:
  worker:
    role: worker
    image: ghcr.io/acme/worker:1.0.0
    resourcePreset: small
    environments: [production]
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      metrics:
        - type: cpu
          target: 70
environments:
  production: {}
