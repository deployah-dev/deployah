# $schema: ../../internal/testing/e2e.schema.json
env: dev
steps:
  - deploy: {}
    stopOnFailure: true
  - assert:
      - select:
          apiVersion: apps/v1
          kind: StatefulSet
          name: stateful-basic-dev-db
          labels:
            deployah.dev/project: stateful-basic
            deployah.dev/environment: dev
            deployah.dev/component: db
        expect:
          spec:
            replicas: 1
            template:
              spec:
                containers:
                  - name: db
                    image: docker.io/library/redis:7-alpine
                    ports:
                      - name: http
                        containerPort: 6379
          status:
            readyReplicas: 1
      - select:
          apiVersion: v1
          kind: Service
          name: stateful-basic-dev-db
        expect:
          spec:
            ports:
              - name: http
                port: 80
                targetPort: http
            selector:
              app.kubernetes.io/instance: stateful-basic-dev
              app.kubernetes.io/name: db
      - select:
          apiVersion: v1
          kind: Service
          name: stateful-basic-dev-db-headless
        expect:
          spec:
            clusterIP: None
            selector:
              app.kubernetes.io/instance: stateful-basic-dev
              app.kubernetes.io/name: db
      - select:
          apiVersion: v1
          kind: PersistentVolumeClaim
          labels:
            deployah.dev/component: db
        expect:
          spec:
            resources:
              requests:
                storage: 20Gi
          status:
            phase: Bound
