apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
    annotations:
        deployah.dev/environment-instance: production
        deployah.dev/project: autoscaling-hpa
        deployah.dev/source: spec
    labels:
        app.kubernetes.io/instance: autoscaling-hpa-production
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: api
        deployah.dev/component: api
        deployah.dev/environment: production
        deployah.dev/instance: autoscaling-hpa-production
        deployah.dev/project: autoscaling-hpa
        helm.sh/chart: api-0.1.0
    name: autoscaling-hpa-production-api
    namespace: default
spec:
    maxReplicas: 10
    metrics:
        - resource:
            name: cpu
            target:
                averageUtilization: 75
                type: Utilization
          type: Resource
        - resource:
            name: memory
            target:
                averageUtilization: 80
                type: Utilization
          type: Resource
    minReplicas: 2
    scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: autoscaling-hpa-production-api
