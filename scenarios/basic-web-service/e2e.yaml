# $schema: ../../internal/testing/e2e/e2e.schema.json
env: dev
steps:
  - plan:
      detailedExitCode: true
      output:
        exitCode: 2
      expr:
        - 'plan.helmAction == "install"'
        - 'plan.summary.create > 0'
    stopOnFailure: true
  - deploy: {}
    stopOnFailure: true
  - assert:
      - select:
          apiVersion: apps/v1
          kind: Deployment
          name: basic-web-service-dev
          labels:
            deployah.dev/project: basic-web-service
            deployah.dev/environment: dev
            deployah.dev/component: web
        expect:
          spec:
            replicas: 1
            template:
              spec:
                containers:
                  - name: web
                    image: docker.io/library/nginx:latest
                    ports:
                      - name: http
                        containerPort: 80
          status:
            readyReplicas: 1
      - select:
          apiVersion: v1
          kind: Service
          name: basic-web-service-dev
        expect:
          spec:
            ports:
              - name: http
                port: 80
                targetPort: http
            selector:
              app.kubernetes.io/instance: basic-web-service-dev
              app.kubernetes.io/name: web
      - select:
          apiVersion: v1
          kind: Pod
          labels:
            deployah.dev/project: basic-web-service
            deployah.dev/environment: dev
        expect:
          status:
            phase: Running
  - plan:
      detailedExitCode: true
      output:
        exitCode: 0
      expr:
        - 'plan.changes.size() == 0'
        - 'plan.summary.total == 0'
    stopOnFailure: true
