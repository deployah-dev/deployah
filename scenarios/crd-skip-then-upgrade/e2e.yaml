# $schema: ../../internal/testing/e2e.schema.json
env: dev
parallel: false
steps:
  - deploy:
      args: ["--skip-crds"]
    stopOnFailure: true
  - assert:
      - select:
          apiVersion: apps/v1
          kind: Deployment
          name: crd-skip-then-upgrade-dev-web
        expect:
          status:
            readyReplicas: 1
      - select:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          name: skipwidgets.example.com
        expr:
          - 'objects.size() == 0'
  - deploy: {}
    stopOnFailure: true
  - assert:
      - select:
          apiVersion: apps/v1
          kind: Deployment
          name: crd-skip-then-upgrade-dev-web
        expect:
          status:
            readyReplicas: 1
      - select:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          name: skipwidgets.example.com
        expr:
          - 'objects.size() == 0'
