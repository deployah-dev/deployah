# $schema: ../../internal/testing/e2e/e2e.schema.json
env: dev
parallel: false
steps:
  - deploy: {}
    stopOnFailure: true
  - assert:
      - select:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          name: idempotentwidgets.example.com
        expect:
          status:
            conditions:
              - type: Established
                status: "True"
      - select:
          apiVersion: apps/v1
          kind: Deployment
          name: crd-create-idempotent-dev-web
        expect:
          status:
            readyReplicas: 1
  - deploy:
      output:
        stderr:
          contains:
            - Deployed
    stopOnFailure: true
  - assert:
      - select:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          name: idempotentwidgets.example.com
        expect:
          status:
            conditions:
              - type: Established
                status: "True"
