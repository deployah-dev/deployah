# $schema: ../../internal/testing/e2e.schema.json
env: dev
parallel: false
steps:
  - deploy:
      args: [--crds, create]
    resources:
      - match:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: idempotentwidgets.example.com
          status:
            conditions:
              - type: Established
                status: "True"
  - deploy:
      args: [--crds, create]
    stderrContains: already present
