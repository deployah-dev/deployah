# $schema: ../../internal/testing/e2e/e2e.schema.json
env: dev
steps:
  - deploy: {}
    stopOnFailure: true
  - assert:
      - select:
          apiVersion: apps/v1
          kind: Deployment
          name: worker-basic-dev
          labels:
            deployah.dev/project: worker-basic
            deployah.dev/environment: dev
            deployah.dev/component: worker
        expect:
          spec:
            replicas: 1
            template:
              spec:
                containers:
                  - name: worker
                    image: docker.io/library/busybox:1.36
                    command: ["sleep"]
                    args: ["infinity"]
          status:
            readyReplicas: 1
      - select:
          apiVersion: v1
          kind: Pod
          labels:
            deployah.dev/project: worker-basic
            deployah.dev/environment: dev
        expect:
          status:
            phase: Running
