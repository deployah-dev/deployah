# $schema: ../../internal/spec/schema/v1-alpha.5/manifest.json
apiVersion: v1-alpha.5
project: task-after-order
components:
  api:
    image: nginx:latest
    port: 8080
    environments: [dev]
    resourcePreset: small
tasks:
  migrate:
    from: api
    "on": preDeploy
    command: ["migrate", "up"]
  seed:
    from: api
    "on": preDeploy
    after: [migrate]
    command: ["seed"]
environments:
  dev: {}
