# $schema: ../../internal/testing/e2e.schema.json
env: dev
steps:
  - deploy: {}
    stopOnFailure: true
  - assert:
      - select:
          apiVersion: apps/v1
          kind: StatefulSet
          name: stateful-scale-dev-cache
        expect:
          status:
            readyReplicas: 1
  - deploy:
      spec: deployah-replicas-2.yaml
    timeout: 5m
    stopOnFailure: true
  - assert:
      - select:
          apiVersion: apps/v1
          kind: StatefulSet
          name: stateful-scale-dev-cache
        expect:
          spec:
            replicas: 2
          status:
            readyReplicas: 2
      - select:
          apiVersion: v1
          kind: PersistentVolumeClaim
          labels:
            deployah.dev/component: cache
        expect:
          status:
            phase: Bound
        expr:
          - 'objects.size() >= 2'
    timeout: 5m
