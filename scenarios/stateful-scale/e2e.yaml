# $schema: ../../internal/testing/e2e.schema.json
env: dev
steps:
  - deploy: {}
    resources:
      - match:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: stateful-scale-dev-cache
          status:
            readyReplicas: 1
  - deploy:
      spec: deployah-replicas-2.yaml
    timeout: 5m
    resources:
      - match:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: stateful-scale-dev-cache
          spec:
            replicas: 2
          status:
            readyReplicas: 2
      - minCount: 2
        match:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            labels:
              deployah.dev/component: cache
          status:
            phase: Bound
