# $schema: ../../internal/testing/e2e/e2e.schema.json
env: dev
steps:
  - deploy: {}
    stopOnFailure: true
  - assert:
      - select:
          apiVersion: batch/v1
          kind: CronJob
          name: taskcron-dev-cleanup
          labels:
            deployah.dev/project: taskcron
            deployah.dev/component: cleanup
        expect:
          metadata:
            annotations:
              helm.sh/hook: null
          spec:
            schedule: "@every 1h"
            timeZone: Etc/UTC
            concurrencyPolicy: Forbid
            successfulJobsHistoryLimit: 3
            failedJobsHistoryLimit: 3
            startingDeadlineSeconds: null
            jobTemplate:
              spec:
                completionMode: Indexed
                activeDeadlineSeconds: 3600
                template:
                  spec:
                    restartPolicy: OnFailure
                    containers:
                      - name: cleanup
                        command: ["echo", "cleanup-ok"]
  - plan:
      detailedExitCode: true
      output:
        exitCode: 2
      expr:
        - 'plan.helmAction == "none"'
        - 'plan.changes.size() == 0'
        - 'plan.summary.total == 0'
        - 'plan.tasks.exists(t, t.name == "cleanup" && t.phase == "schedule" && t.action == "create" && !t.willRun)'
    stopOnFailure: true
  - run:
      task: cleanup
    stopOnFailure: true
  - assert:
      - select:
          apiVersion: batch/v1
          kind: Job
          labels:
            deployah.dev/project: taskcron
            deployah.dev/component: cleanup
            deployah.dev/managed-by: deployah
        expect:
          spec:
            activeDeadlineSeconds: null
          status:
            succeeded: 1
