# $schema: ../../internal/testing/e2e.schema.json
env: prod
parallel: false
resources:
  - match:
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: clusterwidgets.example.com
      status:
        conditions:
          - type: Established
            status: "True"
  - match:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: shared-widget
  - match:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: extras-env-and-crds-prod-web
      status:
        readyReplicas: 1
