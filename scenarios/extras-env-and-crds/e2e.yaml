# $schema: ../../internal/testing/e2e.schema.json
env: prod
parallel: false
steps:
  - deploy: {}
    stopOnFailure: true
  - assert:
      - select:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          name: clusterwidgets.example.com
        expect:
          status:
            conditions:
              - type: Established
                status: "True"
      - select:
          apiVersion: v1
          kind: ConfigMap
          name: shared-widget
        expr:
          - 'objects.size() == 1'
      - select:
          apiVersion: apps/v1
          kind: Deployment
          name: extras-env-and-crds-prod-web
        expect:
          status:
            readyReplicas: 1
