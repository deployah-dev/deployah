apiVersion: batch/v1
kind: Job
metadata:
    annotations:
        deployah.dev/project: task-pre-post-hooks
        deployah.dev/source: spec
        helm.sh/hook: pre-install,pre-upgrade
        helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
        helm.sh/hook-weight: "0"
    labels:
        app.kubernetes.io/instance: task-pre-post-hooks-dev
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: migrate
        deployah.dev/component: migrate
        deployah.dev/environment: dev
        deployah.dev/project: task-pre-post-hooks
        helm.sh/chart: migrate-0.1.0
    name: task-pre-post-hooks-dev-migrate
    namespace: default
spec:
    activeDeadlineSeconds: 300
    backoffLimit: 3
    completionMode: Indexed
    completions: 1
    parallelism: 1
    template:
        metadata:
            labels:
                app.kubernetes.io/instance: task-pre-post-hooks-dev
                app.kubernetes.io/managed-by: Helm
                app.kubernetes.io/name: migrate
                deployah.dev/component: migrate
                deployah.dev/environment: dev
                deployah.dev/project: task-pre-post-hooks
                helm.sh/chart: migrate-0.1.0
        spec:
            automountServiceAccountToken: false
            containers:
                - command:
                    - migrate
                    - up
                  env:
                    - name: DATABASE_URL
                      value: postgres://db
                  image: docker.io/library/nginx:latest
                  imagePullPolicy: Always
                  name: migrate
                  resources:
                    limits: {}
                    requests:
                        cpu: 500m
                        ephemeral-storage: 50Mi
                        memory: 512Mi
            restartPolicy: OnFailure
