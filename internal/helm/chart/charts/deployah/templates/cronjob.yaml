{{- define "deployah.cronjob" -}}
{{- if .Values.cronjob.enabled -}}
{{- if and .Values.cronjob.timeZone (ne .Values.cronjob.timeZone "Etc/UTC") }}
{{- if not (semverCompare ">=1.27-0" .Capabilities.KubeVersion.Version) }}
{{- fail (printf "task %q sets timeZone %q, which requires Kubernetes 1.27 or later (cluster reports %s): CronJob.spec.timeZone is silently dropped by older API servers" .Chart.Name .Values.cronjob.timeZone .Capabilities.KubeVersion.Version) }}
{{- end }}
{{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "deployah.cronjob.name" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  {{- $labels := include "common.tplvalues.merge" (dict "values" (list .Values.labels .Values.commonLabels) "context" .) | fromYaml }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" $labels "context" $ ) | nindent 4 }}
  {{- $annotations := include "common.tplvalues.merge" (dict "values" (list .Values.annotations .Values.commonAnnotations) "context" .) | fromYaml }}
  {{- if $annotations }}
  annotations:
    {{- include "common.tplvalues.render" ( dict "value" $annotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  timeZone: {{ .Values.cronjob.timeZone | quote }}
  concurrencyPolicy: {{ .Values.cronjob.concurrencyPolicy | quote }}
  suspend: {{ .Values.cronjob.suspend }}
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      completionMode: Indexed
      completions: {{ .Values.cronjob.completions }}
      parallelism: {{ .Values.cronjob.parallelism }}
      backoffLimit: {{ .Values.cronjob.backoffLimit }}
      {{- with .Values.cronjob.activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ . }}
      {{- end }}
      {{- if hasKey .Values.cronjob "ttlSecondsAfterFinished" }}
      ttlSecondsAfterFinished: {{ .Values.cronjob.ttlSecondsAfterFinished }}
      {{- end }}
      template:
        metadata:
          {{- $podLabels := include "common.tplvalues.merge" (dict "values" (list .Values.podLabels .Values.commonLabels) "context" .) | fromYaml }}
          labels: {{- include "common.labels.standard" ( dict "customLabels" $podLabels "context" $ ) | nindent 12 }}
          {{- if .Values.podAnnotations }}
          annotations: {{- toYaml .Values.podAnnotations | nindent 12 }}
          {{- end }}
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          {{- include "common.images.renderPullSecrets" (dict "images" (list .Values.image) "context" $) | nindent 10 }}
          {{- if .Values.nodeSelector }}
          nodeSelector: {{- toYaml .Values.nodeSelector | nindent 12 }}
          {{- end }}
          {{- if .Values.tolerations }}
          tolerations: {{- toYaml .Values.tolerations | nindent 12 }}
          {{- end }}
          {{- if .Values.podSecurityContext.enabled }}
          securityContext: {{- omit .Values.podSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          containers:
            - name: {{ .Chart.Name }}
              {{- if .Values.containerSecurityContext.enabled }}
              securityContext: {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 16 }}
              {{- end }}
              image: {{ include "common.images.image" (dict "imageRoot" .Values.image "global" .Values.global) }}
              imagePullPolicy: {{ default (eq .Values.image.tag "latest" | ternary "Always" "IfNotPresent") .Values.image.pullPolicy }}
              {{- if .Values.command }}
              command: {{- toYaml .Values.command | nindent 16 }}
              {{- end }}
              {{- if .Values.args }}
              args: {{- toYaml .Values.args | nindent 16 }}
              {{- end }}
              {{- if .Values.envVars }}
              env:
                {{- $env := .Values.envVars }}
                {{- range $key := keys $env | sortAlpha }}
                {{- $val := index $env $key }}
                - name: {{ $key | quote }}
                  value: {{ $val | quote }}
                {{- end }}
              {{- end }}
              {{- if .Values.resources }}
              resources: {{- toYaml .Values.resources | nindent 16 }}
              {{- end }}
{{- end }}
{{- end }}
