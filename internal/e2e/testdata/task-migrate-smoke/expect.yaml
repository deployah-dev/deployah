env: dev
namespace: default
deployments:
  - name: taskdemo-dev-api
    replicas: 1
    image: docker.io/library/nginx:latest
    portName: http
    labels:
      deployah.dev/project: taskdemo
      deployah.dev/environment: dev
      deployah.dev/component: api
services:
  - name: taskdemo-dev-api
    port: 80
    targetPortName: http
    selector:
      app.kubernetes.io/instance: taskdemo-dev
      app.kubernetes.io/name: api
pods:
  labelSelector: "deployah.dev/project=taskdemo,deployah.dev/environment=dev,deployah.dev/component=api"
  minCount: 1
  phase: Running
