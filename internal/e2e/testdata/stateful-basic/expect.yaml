env: dev
namespace: default
statefulSets:
  - name: stateful-basic-dev-cache
    replicas: 1
    image: docker.io/library/redis:7-alpine
    portName: http
    labels:
      deployah.dev/project: stateful-basic
      deployah.dev/environment: dev
      deployah.dev/component: cache
services:
  - name: stateful-basic-dev-cache
    port: 80
    targetPortName: http
    selector:
      app.kubernetes.io/instance: stateful-basic-dev
      app.kubernetes.io/name: cache
  - name: stateful-basic-dev-cache-headless
    port: 80
    targetPortName: http
    clusterIP: None
    selector:
      app.kubernetes.io/instance: stateful-basic-dev
      app.kubernetes.io/name: cache
pvcs:
  - namePrefix: data-stateful-basic-dev-cache-
    minCount: 1
    phase: Bound
    storage: 1Gi
pods:
  labelSelector: "deployah.dev/project=stateful-basic,deployah.dev/environment=dev"
  minCount: 1
  phase: Running
