codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "60..80"
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%

parsers:
  go:
    partials_as_hits: true

comment:
  layout: "header, diff, flags"
  behavior: default
  require_changes: true

flag_management:
  default_rules:
    carryforward: true
    statuses:
      - type: project
        target: auto
        threshold: 1%
      # Patch coverage is gated once under coverage.status.patch. Flags only
      # report project trends so unit and integration uploads are not each
      # held to a separate patch target.
  individual_flags:
    - name: unittests
      carryforward: true
    - name: integration
      carryforward: true

ignore:
  - "**/examples/**"
  - "scenarios/**"
