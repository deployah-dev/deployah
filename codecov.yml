codecov:
  require_ci_to_pass: true
  notify:
    # Wait for all three coverage uploads before posting, not just the first.
    # Only coverage reports count (unittests, integration, e2e); JUnit
    # test_results go to Test Analytics and do not. A suite with no countable
    # coverage after the ignore globs is dropped and won't count.
    after_n_builds: 3

github_checks:
  # Skip inline per-line annotations in the PR diff; the PR comment already
  # summarizes coverage, and annotations on every uncovered line add noise.
  annotations: false

coverage:
  precision: 2
  round: down
  range: "60..80"
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%

parsers:
  go:
    partials_as_hits: true

comment:
  layout: "header, diff, flags"
  behavior: default
  require_changes: true

flag_management:
  default_rules:
    carryforward: true
    statuses:
      - type: project
        target: auto
        threshold: 1%
      # Patch coverage is gated once under coverage.status.patch. Flags only
      # report project trends so each suite upload is not held to a separate
      # patch target.

ignore:
  - "**/examples/**"
  - "scenarios/**"
