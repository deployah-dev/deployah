# Sync repository labels from .github/labels.yml (create, update, prune).
# Inspired by https://til.simonwillison.net/github-actions/creating-github-labels
name: Update repository labels

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/labels.yml"
      - ".github/labels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # yq is pre-installed on GitHub-hosted Ubuntu runners.
      # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
      - name: Convert labels YAML to JSON
        run: yq -o=json '.' .github/labels.yml > /tmp/labels.json

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const desired = JSON.parse(fs.readFileSync('/tmp/labels.json', 'utf8'));
            const desiredByName = new Map(desired.map((label) => [label.name, label]));
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner,
              repo,
              per_page: 100,
            });

            for (const label of desired) {
              const params = {
                owner,
                repo,
                name: label.name,
                description: label.description || '',
                color: label.color,
              };
              try {
                await github.rest.issues.createLabel(params);
                console.log(`Created '${label.name}'.`);
              } catch (error) {
                if (error.status === 422) {
                  await github.rest.issues.updateLabel(params);
                  console.log(`Updated '${label.name}'.`);
                } else {
                  console.error(`Error syncing '${label.name}': ${error}`);
                  throw error;
                }
              }
            }

            for (const label of existing) {
              if (desiredByName.has(label.name)) {
                continue;
              }
              await github.rest.issues.deleteLabel({
                owner,
                repo,
                name: label.name,
              });
              console.log(`Deleted '${label.name}' (not in .github/labels.yml).`);
            }
